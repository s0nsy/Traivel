version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: traiveldb
    restart: always
    environment:
      POSTGRES_DB: traivel
      POSTGRES_USER: traivel
      POSTGRES_PASSWORD: traivelDB
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: traivelredis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres-data:
