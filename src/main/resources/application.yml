spring:
  application.name: Project
  profiles:
    active: local
  devtools:
    restart:
      enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate.ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.project.kafka"
  elasticsearch:
    uris: http://localhost:9200

jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-do-not-use-in-production-32b}
  access-expiration: 1800000
  refresh-expiration: 604800000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, env
  endpoint:
    health:
      show-details: when-authorized

storage:
  local:
    path: ${user.home}/traivel/images

openai:
  api-key: ${OPENAI_API_KEY}

naver:
  search:
    id: ${NAVER_SEARCH_ID}
    secret: ${NAVER_SEARCH_SECRET}
  map:
    id: ${NAVER_MAP_ID}
    secret: ${NAVER_MAP_SECRET}

aws:
  access-key: ${AMAZON_ACCESS_KEY:}
  secret-key: ${AMAZON_SECRET_ACCESS_KEY:}
  region: ap-northeast-2
  s3:
    bucket: ${AWS_S3_BUCKET:}

